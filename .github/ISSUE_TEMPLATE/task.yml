name: Task
description: A piece of work with a clear result and a way to check it's done.
body:
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What exists when this is done.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Things anyone can check.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
  - type: textarea
    id: depends
    attributes:
      label: Depends on
  - type: checkboxes
    id: integrity
    attributes:
      label: Check
      options:
        - label: Doesn't name an unreviewed case or template.
          required: true
