# The unattended factory. Adding `ready-for-agent` to a ticket in this repo starts a run at once; a
# schedule picks up tickets in the other repos in factory.json. One run takes at most one ticket, with the
# /factory loop in headless Claude Code, and reports on the ticket. It never merges. See
# docs/factory-trigger.md.
name: Factory

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Any ticket ready?
    # Only the owner starts a run: the owner's label, the owner's manual dispatch, or the schedule (which
    # runs the workflow as it is on main). Any other event stops here, before a job with secrets. The tick
    # then also refuses a ticket whose label, text, edits or comments aren't all the owner's.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.label.name == 'ready-for-agent' &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.count.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: factory.json
          persist-credentials: false
      - id: count
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          ready=0
          for repo in $(node -e 'for (const r of Object.values(require("./factory.json").repos)) console.log(r.github)'); do
            owner="${repo%%/*}"
            # agent-working too: a tick is what recovers a ticket an interrupted run left behind. Not one
            # a run on the owner's PC claimed and that shows no result yet: that one is the PC's to recover, and
            # counting it would start a tick that does nothing every 15 minutes.
            for label in ready-for-agent agent-working; do
              if [ "$label" = ready-for-agent ]; then
                n=$(gh api "repos/$repo/issues?state=open&labels=$label&per_page=100" --jq '[.[] | select(.pull_request | not)] | length')
              else
                n=0
                for item in $(gh api "repos/$repo/issues?state=open&labels=$label&per_page=100" --jq '.[] | select(.pull_request | not) | "\(.number):\([.labels[].name | select(. == "agent-done" or . == "agent-needs-help")] | length)"'); do
                  num="${item%%:*}"
                  if [ "${item##*:}" = 0 ]; then
                    mode=$(gh api --paginate "repos/$repo/issues/$num/comments?per_page=100" --jq ".[] | select(.user.login == \"$owner\") | .body | capture(\"<!-- scheduled-run claim mode=(?<m>ci|local) -->\").m" | tail -n 1)
                    if [ "$mode" = local ]; then
                      echo "$repo#$num: claimed by a run on the owner's PC, left to it"
                      continue
                    fi
                  fi
                  n=$((n + 1))
                done
              fi
              echo "$repo: $n labelled $label"
              ready=$((ready + n))
            done
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  tick:
    name: Factory tick
    needs: look
    if: needs.look.outputs.ready != '0'
    runs-on: ubuntu-latest
    # One tick at a time; a second waits instead of cancelling the one in progress. On the job, not the
    # workflow: a tick's own label events start workflow runs too, and at workflow level such a run could
    # replace the owner's queued one and leave the ticket for the schedule. Every run's `look` job now runs
    # at once, and only ticks wait; two waiting ticks are alike, each takes the oldest ready ticket (audit N-5).
    concurrency:
      group: factory-tick
      cancel-in-progress: false
    # The agent gets --minutes; the tick then audits, verifies the PR (revert:check alone may take 25
    # minutes) and saves evidence. 45 minutes beyond the agent keeps a cancelled job from stranding a ticket.
    timeout-minutes: 165
    # The tick's exit code, for the alert job.
    outputs:
      code: ${{ steps.tick.outputs.code || steps.unreported.outputs.code }}
    # Secrets are given to the steps that need them, never to the whole job, and no checkout keeps its token
    # in .git/config: git authenticates through gh, which reads GH_TOKEN from the environment at push time.
    steps:
      # Same layout as the owner's folders: FaultForge/ and faultforge-target/. No private repo before the tick:
      # a target ticket's agent runs with nothing private on disk. The runner clones it when it needs it, into
      # FaultForge/private only for a lab ticket, and removes its own clone again (factory-private.ts).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: FaultForge
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AJBeumer/faultforge-target
          ref: main
          path: faultforge-target
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies and Claude Code
        run: |
          (cd FaultForge && npm ci --no-audit --no-fund)
          (cd faultforge-target && npm ci --no-audit --no-fund)
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.197
      - name: Commit and push as the owner
        # The owner's token, so pushes and PRs come from the owner and Qodo reviews them (it ignores bots).
        # `gh auth setup-git` makes git ask gh for credentials, so the token stays in the environment.
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name "$(gh api user --jq .login)"
          git config --global user.email "$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
      # The git-level guard, as on the owner's PC: a commit or push in the target that would give the lab
      # away is refused by git itself, whatever ran it. Before the agent can make one.
      - name: Install the git-level guard
        working-directory: FaultForge
        run: npm run -s guard:install
      # A copy of the harness as it is now, before the agent exists, in the runner's own temp folder, which the
      # agent's user is never given. The steps after the agent run from it: the checkout under the workspace
      # is the agent's to write, so its scripts, packages and git hooks could be the agent's code by then. Before
      # the sandbox's setup, so no ACL of the agent's user is copied with it.
      - name: Keep a trusted copy of the harness
        run: cp -a "$GITHUB_WORKSPACE/FaultForge" "$RUNNER_TEMP/trusted-harness"
      # The agent's network sandbox: the agent runs as its own user, whose packets reach loopback only,
      # where the tick's proxy lets them through to factory.json's allow-list and nowhere else. Only the agent's
      # process tree is inside it: this step, the tick itself and every step after it keep the runner's network.
      # After the git config and the guard, which it copies and gives the agent. The tick checks it again and
      # never starts the agent without it.
      - name: Set up the agent's network sandbox
        working-directory: FaultForge
        run: npm run -s factory:sandbox -- setup --dir "$GITHUB_WORKSPACE"
      - name: Run one tick
        id: tick
        working-directory: FaultForge
        # Ten minutes inside the job's own limit: a tick stopped here still leaves the job time to keep its logs.
        timeout-minutes: 155
        # The runner context exists in a step's env, not in the job's.
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent's own, narrower token (the target and this repo only, no private repo): it becomes the
          # agent's GH_TOKEN. Unset, the agent gets FACTORY_GH_TOKEN and the run log warns.
          FAULTFORGE_AGENT_TOKEN: ${{ secrets.FACTORY_AGENT_TOKEN }}
          FAULTFORGE_RUNS_DIR: ${{ runner.temp }}/faultforge-runs
          FAULTFORGE_PRIVATE_REPO: AJBeumer/faultforge-private
        # The outcome is shown on the run's page, not only in its log: an error annotation when the tick failed
        # (exit 3) or couldn't set up (exit 2), and one summary line for every outcome. Fixed words and the run's
        # own number only: nothing the tick printed, so no path or ticket text reaches the page.
        run: |
          code=0
          npm run -s factory:tick -- --ci --minutes 120 --budget 25 || code=$?
          case "$code" in
            0) outcome="ended: a run delivered, or there was nothing to take" ;;
            1) outcome="needs help: the ticket it took is labelled agent-needs-help" ;;
            2) outcome="could not set up: the command line or the environment was wrong, so no tick ran" ;;
            3) outcome="failed: the tick itself stopped with an error" ;;
            *) outcome="stopped with an unexpected exit code" ;;
          esac
          line="Factory tick, run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT: $outcome (exit $code)"
          if [ "$code" = 2 ] || [ "$code" = 3 ]; then echo "::error title=Factory tick::$line"; fi
          echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          echo "reported=true" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # A tick step that was cancelled or hit its time limit never reached its own report above. It hands on
      # `stopped`, so the alert job raises one for it too.
      - name: Report a tick that stopped without reporting
        id: unreported
        if: always() && steps.tick.outcome != 'skipped' && steps.tick.outputs.reported != 'true'
        run: |
          line="Factory tick, run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT: stopped without reporting (cancelled or out of time)"
          echo "::error title=Factory tick::$line"
          echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          echo "code=stopped" >> "$GITHUB_OUTPUT"
      # No process of the agent's user outlives the tick, even one a cancelled or crashed tick left: none is
      # running when the private repo is checked out below. Plain shell, not a script from the checkout,
      # which the agent could have changed.
      - name: Stop the agent's sandbox
        id: stop
        if: always()
        run: |
          id -u ffagent >/dev/null 2>&1 || exit 0
          sudo -n pkill -KILL -u ffagent || true
          for i in $(seq 40); do pgrep -u ffagent >/dev/null || exit 0; sleep 0.25; done
          echo "::error title=Factory sandbox::a process of the agent's user is still running"
          exit 1
      # A cancelled or timed-out job, or a tick that crashed, never pushed its last copy: the transcript and
      # event log of any run that didn't log `saved` go to a branch of the private repo, never to an artifact.
      # Only after the tick, when no agent runs any more, and never while a process of the agent's user is left.
      # If one is, the job fails, and the logs stay in the run's own folder. A fresh clone into the
      # trusted copy, never an action's checkout into the workspace: a lab ticket's run left a clone there whose
      # .git (hooks, config) the agent could write, and actions/checkout would reuse it. Plain shell.
      - name: Clone private storage for the logs
        if: always() && steps.stop.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          FAULTFORGE_PRIVATE_REPO: AJBeumer/faultforge-private
        run: |
          rm -rf "$RUNNER_TEMP/trusted-harness/private"
          git clone --quiet "https://github.com/$FAULTFORGE_PRIVATE_REPO.git" "$RUNNER_TEMP/trusted-harness/private"
      # From the trusted copy: the script, its packages and npm's own config are as they were before the agent ran.
      - name: Keep the logs of a run that didn't save them
        if: always() && steps.stop.outcome == 'success'
        working-directory: ${{ runner.temp }}/trusted-harness
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          FAULTFORGE_RUNS_DIR: ${{ runner.temp }}/faultforge-runs
        run: npm run -s factory:keep -- --branch unsaved-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the event log: artifacts of a public repo are downloadable. The agent's full transcript is
      # pushed to the private repo by the tick, and never uploaded here.
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/faultforge-runs/*.jsonl
            !${{ runner.temp }}/faultforge-runs/*.agent.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # A tick that couldn't set up (exit 2), failed (exit 3) or stopped without reporting (cancelled or out of time)
  # opens the lab's alert issue, or comments on the open one. Exit 1 is a ticket that needs help, which the ticket itself reports. issues: write for this job
  # alone, with the lab's own token; the tick's job keeps its own permissions.
  alert:
    name: Alert on a failed tick
    needs: tick
    if: always() && (needs.tick.outputs.code == '2' || needs.tick.outputs.code == '3' || needs.tick.outputs.code == 'stopped')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert.yml
    with:
      kind: factory
      outcome: ${{ needs.tick.outputs.code }}
