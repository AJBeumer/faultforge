# The unattended factory. Adding `ready-for-agent` to a ticket in this repo starts a run at once; a
# schedule picks up tickets in the other repos in factory.json. One run takes at most one ticket, with the
# /factory loop in headless Claude Code, and reports on the ticket. It never merges. See
# docs/factory-trigger.md.
name: Factory

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Any ticket ready?
    # Only the owner starts a run: the owner's label, the owner's manual dispatch, or the schedule (which
    # runs the workflow as it is on main). Any other event stops here, before a job with secrets. The tick
    # then also refuses a ticket whose label, text, edits or comments aren't all the owner's.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.label.name == 'ready-for-agent' &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.count.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: factory.json
          persist-credentials: false
      - id: count
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          ready=0
          for repo in $(node -e 'for (const r of Object.values(require("./factory.json").repos)) console.log(r.github)'); do
            # agent-working too: a tick is what recovers a ticket an interrupted run left behind (#197).
            for label in ready-for-agent agent-working; do
              n=$(gh api "repos/$repo/issues?state=open&labels=$label&per_page=100" --jq '[.[] | select(.pull_request | not)] | length')
              echo "$repo: $n labelled $label"
              ready=$((ready + n))
            done
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  tick:
    name: Factory tick
    needs: look
    if: needs.look.outputs.ready != '0'
    runs-on: ubuntu-latest
    # One tick at a time; a second waits instead of cancelling the one in progress. On the job, not the
    # workflow: a tick's own label events start workflow runs too, and at workflow level such a run could
    # replace the owner's queued one and leave the ticket for the schedule. Every run's `look` job now runs
    # at once, and only ticks wait; two waiting ticks are alike, each takes the oldest ready ticket (audit N-5).
    concurrency:
      group: factory-tick
      cancel-in-progress: false
    # The agent gets --minutes; the tick then audits, verifies the PR (revert:check alone may take 25
    # minutes) and saves evidence. 45 minutes beyond the agent keeps a cancelled job from stranding a ticket.
    timeout-minutes: 165
    # Secrets are given to the steps that need them, never to the whole job, and no checkout keeps its token
    # in .git/config: git authenticates through gh, which reads GH_TOKEN from the environment at push time.
    steps:
      # Same layout as the owner's folders: FaultForge/, FaultForge/private/ and faultforge-target/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: FaultForge
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AJBeumer/faultforge-target
          ref: main
          path: faultforge-target
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AJBeumer/faultforge-private
          ref: main
          path: FaultForge/private
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies and Claude Code
        run: |
          (cd FaultForge && npm ci --no-audit --no-fund)
          (cd faultforge-target && npm ci --no-audit --no-fund)
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.197
      - name: Commit and push as the owner
        # The owner's token, so pushes and PRs come from the owner and Qodo reviews them (it ignores bots).
        # `gh auth setup-git` makes git ask gh for credentials, so the token stays in the environment.
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name "$(gh api user --jq .login)"
          git config --global user.email "$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
      - name: Run one tick
        working-directory: FaultForge
        # Ten minutes inside the job's own limit: a tick stopped here still leaves the job time to keep its logs.
        timeout-minutes: 155
        # The runner context exists in a step's env, not in the job's.
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FAULTFORGE_RUNS_DIR: ${{ runner.temp }}/faultforge-runs
        run: npm run -s factory:tick -- --ci --minutes 120 --budget 25
      # A cancelled or timed-out job, or a tick that crashed, never pushed its last copy: the transcript and
      # event log of any run that didn't log `saved` go to a branch of the private repo, never to an artifact.
      - name: Keep the logs of a run that didn't save them
        if: always()
        working-directory: FaultForge
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          FAULTFORGE_RUNS_DIR: ${{ runner.temp }}/faultforge-runs
        run: npm run -s factory:keep -- --branch unsaved-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the event log: artifacts of a public repo are downloadable. The agent's full transcript is
      # pushed to the private repo by the tick, and never uploaded here.
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/faultforge-runs/*.jsonl
            !${{ runner.temp }}/faultforge-runs/*.agent.jsonl
          if-no-files-found: ignore
          retention-days: 30
