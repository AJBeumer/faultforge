name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to exact commits; the comment says which release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The same check on Windows, where the owner develops: path and line-ending assumptions that pass
  # on Linux fail here first. A separate job, so the Linux job keeps its name.
  check-windows:
    name: npm run check (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The slow tests (packages/*/test), on both systems. They need the reviewed target checked out next to this
  # repository, as on the owner's machine; it is public, so no token is needed. Not one of the checks
  # protect-main requires, so a flaky network can't block a merge, but it runs on every push (#229).
  integration:
    name: npm run test:integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # No checkout keeps its token: `npm ci` runs the target's install scripts, which could otherwise read it
      # from ../FaultForge/.git/config (Qodo on PR 241). This job never pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: FaultForge
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AJBeumer/faultforge-target
          ref: main
          path: faultforge-target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            FaultForge/package-lock.json
            faultforge-target/package-lock.json
      # The tests commit in scratch copies of the target; git needs an identity for that.
      - run: |
          git config --global user.name "integration tests"
          git config --global user.email "integration@example.com"
      - run: npm ci
        working-directory: faultforge-target
      - run: npm ci
        working-directory: FaultForge
      - run: npm run test:integration
        working-directory: FaultForge
